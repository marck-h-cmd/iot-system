##--------------------------------------------------------------------
## MySQL Auth/ACL Plugin para EMQX Broker v4.4
## Archivo de configuración: emqx_auth_mysql.conf
##--------------------------------------------------------------------

## Servidor MySQL dentro de la red Docker unificada (iot_network)
auth.mysql.server = mysql:3306
auth.mysql.pool = 8
auth.mysql.username = emqx_user
auth.mysql.password = emqx_pass
auth.mysql.database = emqx_db
auth.mysql.query_timeout = 5s

## Consulta de Autenticación de Clientes MQTT
## %u = username, %c = clientid
auth.mysql.auth_query = select password from mqtt_user where username = '%u' limit 1

## Método de encriptación de claves: plain (para compatibilidad directa con el entorno de pruebas de laboratorio)
auth.mysql.password_hash = plain

## Consulta para determinar privilegios de Superusuario
auth.mysql.super_query = select is_superuser from mqtt_user where username = '%u' limit 1

## Consulta de Control de Acceso (ACL)
## %a = dirección IP, %u = nombre de usuario, %c = client id
auth.mysql.acl_query = select allow, ipaddr, username, clientid, access, topic from mqtt_acl where ipaddr = '%a' or username = '%u' or username = '$all' or clientid = '%c'
